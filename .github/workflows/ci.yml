name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --release --locked

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      STATUSLINE_GIT: 'off'
      STATUSLINE_SCOPED: 'off'
      PAYLOAD: '{"model":{"display_name":"Claude Opus 5.5"},"workspace":{"project_dir":"/x/proj"},"effort":{"level":"max"}}'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: install.sh, build and download
        shell: bash
        run: |
          for mode in build download; do
            dir="$RUNNER_TEMP/sh-$mode"
            if [ "$mode" = download ]; then export CLAUDE_STATUSLINE_DOWNLOAD=1; fi
            CLAUDE_STATUSLINE_DIR="$dir" sh ./install.sh
            CLAUDE_STATUSLINE_DIR="$dir" sh ./install.sh >/dev/null
            exe="$dir/claude-statusline"; [ -e "$exe" ] || exe="$exe.exe"
            out=$(printf '%s' "$PAYLOAD" | "$exe")
            echo "$out"
            case "$out" in *"Opus 5.5"*MAX*) ;; *) echo "unexpected output" >&2; exit 1 ;; esac
          done
      - name: install.ps1, build and download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($mode in 'build', 'download') {
            $dir = Join-Path $env:RUNNER_TEMP "ps-$mode"
            if ($mode -eq 'download') { $env:CLAUDE_STATUSLINE_DOWNLOAD = '1' }
            $env:CLAUDE_STATUSLINE_DIR = $dir
            ./install.ps1
            ./install.ps1 | Out-Null
            $out = $env:PAYLOAD | & (Join-Path $dir 'claude-statusline.exe')
            Write-Host $out
            if ($out -notmatch 'Opus 5\.5.*MAX') { throw 'unexpected output' }
          }
